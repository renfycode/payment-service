[project]
name = "payments"
version = "0.1.0"
description = "Асинхронный сервис процессинга платежей"
readme = "README.md"
authors = [
    { name = "gleb.pekhov", email = "gleb.pekhov@fin-frame.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "faststream[rabbit]>=0.7.7",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uuid-utils>=1.0.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "testcontainers[postgres,rabbitmq]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PL", "PT", "TC", "N"]
ignore = ["PLR2004", "PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Security"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: tests that require Docker (Postgres, RabbitMQ, webhook receiver)"]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers.*",
]
